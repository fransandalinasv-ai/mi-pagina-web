<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SANDA — Ingeniero Artista. Portfolio de Francesc Sandalinas: Diseño 3D, Software, Filosofía y Arte.">
  <meta name="author" content="Francesc Sandalinas">
  <meta name="theme-color" content="#000000">

  <title>SANDA — Ingeniero Artista</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->
  <link rel="icon" href="assets/images/branding/sanda-icon.png" type="image/png">

  <!-- Preload Imagen Principal -->
  <link rel="preload" as="image" href="assets/images/slides/design-lamp.webp">
</head>

<body class="no-scroll">

  <!-- ============================================
       SLIDER — Estado A (horizontal, fullscreen)
       El contenido de los slides se genera desde config.js
       ============================================ -->
  <div id="slider-container" class="slider active">

    <header class="slider__header">
      <!-- Selector de idioma -->
      <div class="lang-switcher">
        <button onclick="setLanguage('es')" id="btn-lang-es" class="lang-btn">ES</button>
        <span class="lang-sep">|</span>
        <button onclick="setLanguage('en')" id="btn-lang-en" class="lang-btn">EN</button>
      </div>
      
      <a href="/" class="slider__logo" aria-label="AZ DISSENY by SANDA - Inicio" id="brand-name">
        <span class="logo-principal">AZ DISSENY</span>
        <span class="firma-sanda">by SANDA</span>
      </a>
    </header>

    <div id="slider-track" class="slider__track" role="region" aria-label="Slider principal">
      <!-- Los slides se generan automáticamente desde js/config.js -->
    </div>

    <nav class="slider__controls" aria-label="Controles del slider">
      <button class="slider__arrow slider__arrow--prev" aria-label="Slide anterior">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="slider__dots" role="tablist" aria-label="Indicadores de slide"></div>
      <button class="slider__arrow slider__arrow--next" aria-label="Siguiente slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </nav>
  </div>


  <!-- ============================================
       DETAIL — Estado B (scroll vertical)
       Las secciones se generan desde config.js
       ============================================ -->
  <main id="detail-container" class="detail hidden">

    <button id="back-btn" class="detail__back" aria-label="Volver al menú principal">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Volver
    </button>

    <div id="detail-sections">
      <!-- Las secciones de detalle se generan automáticamente desde js/config.js -->
    </div>
  </main>


  <!-- ============================================
       LIGHTBOX — Visor de imágenes fullscreen
       ============================================ -->
  <div id="lightbox" class="lightbox" role="dialog" aria-label="Visor de imagen" aria-hidden="true">
    <button id="lightbox-close" class="lightbox__close" aria-label="Cerrar visor">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <button id="lightbox-prev" class="lightbox__nav lightbox__nav--prev" aria-label="Imagen anterior">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <img id="lightbox-img" class="lightbox__img" src="" alt="Imagen ampliada">
    <button id="lightbox-next" class="lightbox__nav lightbox__nav--next" aria-label="Siguiente imagen">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>


  <!-- ============================================
       FOOTER — Generado desde config.js
       ============================================ -->
  <footer class="site-footer" aria-label="Pie de página">
    <div id="footer-content" class="site-footer__content">
      <!-- Contenido generado por JavaScript -->
    </div>
  </footer>


  <!-- ============================================
       SCRIPTS — Orden importante:
       1. config.js (datos) se carga ANTES que main.js (lógica)
       ============================================ -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
